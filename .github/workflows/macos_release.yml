name: macOS Release Pipeline

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - 'appcast.xml'
      - '*.md'
      - 'docs/**'

jobs:
  build-and-release:
    name: Build & Release macOS App
    runs-on: macos-14

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Info
        id: version_info
        shell: bash
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          SHORT_VERSION=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$RAW_VERSION" | cut -d'+' -f2)
          TAG_NAME="v${SHORT_VERSION}"

          echo "SHORT_VERSION=$SHORT_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

          echo "Extracted Version: $SHORT_VERSION (Build $BUILD_NUMBER), Tag: $TAG_NAME"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Disable Swift Package Manager
        run: |
          flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: |
          npm install -g appdmg

      - name: Build macOS App
        run: |
          flutter pub get
          cd macos && pod install && cd ..
          flutter build macos --flavor prod --release --verbose

      - name: Create DMG
        run: |
          mkdir -p release_dmg
          DMG_PATH="release_dmg/BreakMate-Installer.dmg"
          APP_PATH="build/macos/Build/Products/Release-prod/BreakMate.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "❌ App bundle not found at $APP_PATH"
            exit 1
          fi

          rm -f "$DMG_PATH"
          appdmg scripts/appdmg.json "$DMG_PATH"

          echo "✅ DMG created successfully at $DMG_PATH"
          ls -la "$DMG_PATH"

      - name: Sign DMG with Sparkle
        id: signing
        env:
          SPARKLE_PRIVATE_KEY_CONTENT: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          DMG_PATH="release_dmg/BreakMate-Installer.dmg"
          FILE_SIZE=$(stat -f%z "$DMG_PATH")
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT

          # Locate sign_update tool
          SIGN_UPDATE=""
          for candidate in macos/Pods/Sparkle/bin/sign_update scripts/sign_update /usr/local/bin/sign_update /opt/homebrew/bin/sign_update; do
            if [ -x "$candidate" ]; then SIGN_UPDATE="$candidate"; break; fi
          done
          if [ -z "$SIGN_UPDATE" ]; then
            SIGN_UPDATE=$(find macos/Pods/Sparkle -name sign_update -type f 2>/dev/null | head -1)
          fi

          SIGNATURE=""
          if [ -n "$SPARKLE_PRIVATE_KEY_CONTENT" ] && [ -n "$SIGN_UPDATE" ] && [ -f "$SIGN_UPDATE" ]; then
            chmod +x "$SIGN_UPDATE"
            echo "$SPARKLE_PRIVATE_KEY_CONTENT" > /tmp/sparkle_private.pem
            chmod 600 /tmp/sparkle_private.pem

            SIGN_OUTPUT=$("$SIGN_UPDATE" "$DMG_PATH" --ed-key-file /tmp/sparkle_private.pem 2>&1 || true)
            rm -f /tmp/sparkle_private.pem

            SIGNATURE=$(echo "$SIGN_OUTPUT" | grep -oE 'sparkle:edSignature="[^"]+"' | sed 's/sparkle:edSignature="//;s/"$//')
            if [ -n "$SIGNATURE" ]; then
              echo "✅ Successfully generated Sparkle Ed25519 signature."
            else
              echo "::warning::sign_update did not produce a signature. Output: $SIGN_OUTPUT"
            fi
          else
            echo "::warning::SPARKLE_PRIVATE_KEY secret is not configured or sign_update tool is missing. Skipping Sparkle signature."
          fi

          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT

      - name: Update Appcast
        env:
          VERSION: ${{ steps.version_info.outputs.SHORT_VERSION }}
          BUILD_NUMBER: ${{ steps.version_info.outputs.BUILD_NUMBER }}
          SIGNATURE: ${{ steps.signing.outputs.signature }}
          FILE_SIZE: ${{ steps.signing.outputs.file_size }}
          TAG_NAME: ${{ steps.version_info.outputs.TAG_NAME }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/BreakMate-Installer.dmg"
          NOTES_FLAG=""
          if [ -f release_notes.md ]; then
            NOTES_FLAG="--notes-file release_notes.md"
          fi

          python3 scripts/patch_appcast.py \
            --appcast appcast.xml \
            --version "$VERSION" \
            --build "$BUILD_NUMBER" \
            --signature "$SIGNATURE" \
            --size "$FILE_SIZE" \
            --url "$DOWNLOAD_URL" \
            $NOTES_FLAG

      - name: Commit and Push Appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet appcast.xml; then
            git add appcast.xml
            git commit -m "chore: update appcast.xml for ${{ steps.version_info.outputs.TAG_NAME }} [skip ci]"
            git push origin HEAD:main
            echo "✅ appcast.xml committed and pushed to main"
          else
            echo "appcast.xml unchanged — nothing to commit."
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version_info.outputs.TAG_NAME }}
          VERSION: ${{ steps.version_info.outputs.SHORT_VERSION }}
        run: |
          DMG_PATH="release_dmg/BreakMate-Installer.dmg"

          # Delete existing release/tag if it exists to allow safe re-runs (matching create_dmg.sh)
          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "Release $TAG_NAME already exists — deleting and recreating..."
            gh release delete "$TAG_NAME" --yes
            git push origin ":refs/tags/$TAG_NAME" 2>/dev/null || true
          fi

          if [ -f release_notes.md ] && [ -s release_notes.md ]; then
            gh release create "$TAG_NAME" \
              "$DMG_PATH" \
              --title "BreakMate v${VERSION}" \
              --notes-file release_notes.md
          else
            gh release create "$TAG_NAME" \
              "$DMG_PATH" \
              --title "BreakMate v${VERSION}" \
              --generate-notes
          fi

          echo "✅ Release $TAG_NAME published successfully."

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BreakMate-macOS-Installer
          path: |
            release_dmg/BreakMate-Installer.dmg
