name: standup
description: "standup — a macOS menu bar break reminder app for healthy work habits."
publish_to: 'none'
version: 1.0.0+1
#BreakMate
environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  macos_ui: ^2.0.9
  tray_manager: ^0.2.3
  window_manager: ^0.5.1
  flutter_local_notifications: ^18.0.1
  launch_at_startup: ^0.3.1
  package_info_plus: ^8.0.0
  shared_preferences: ^2.3.4
  get_it: ^8.0.3
  provider: ^6.1.2
  screen_retriever: ^0.2.0
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
