name: breakmate
description: "BreakMate — a desktop break-reminder and wellness companion for macOS, Windows and Linux that protects your eyes, posture, and focus."
publish_to: "none"
version: 1.10.0+42
#BreakMate
environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  macos_ui: ^2.0.9
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  flutter_local_notifications: ^22.3.0
  launch_at_startup: ^0.5.1
  package_info_plus: ^9.0.1
  get_it: ^9.2.1
  provider: ^6.1.2
  screen_retriever: ^0.2.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  flutter_acrylic: ^1.0.4
  flutter_markdown: ^0.7.7+1
  path_provider: ^2.1.2
  audioplayers: ^6.7.1
  url_launcher: ^6.3.2
  lucide_icons_flutter: ^3.1.14+1
  flutter_widget_from_html_core: ^0.17.3
  markdown: ^7.3.1
  sentry_flutter: ^9.20.0
  path: ^1.9.1
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  file_picker: ^11.0.3
  flutter_flavor: ^3.1.4
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  clock: ^1.1.2
  hotkey_manager: ^0.2.3
  flutter_svg: ^2.0.17
  vector_graphics: ^1.1.11
  vector_graphics_compiler: ^1.1.11
  blobatar_flutter: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0
  build_runner: ^2.15.1
  objectbox_generator: ^5.3.2
  glados: ^1.1.7
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  fake_async: ^1.3.1


flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    # OneWorks Avatar — Species Snapshots (alpaca, bear, cat, dog, etc.)
    - assets/avatars/species/
    # OneWorks Avatar — Breed Snapshots (bear--brown-bear, cat--black-cat, etc.)
    - assets/avatars/breeds/
    # OneWorks Avatar — Pixel Style Snapshots
    - assets/avatars/pixel/
    # OneWorks Avatar — authored 3D scenes (primitives, face, camera, light)
    - assets/avatars/scenes/
    # OneWorks Avatar — Animation Cover SVGs (idle, happy, celebrate, etc.)
    - assets/avatars/web/
    - assets/avatars/web/assets/
    - assets/avatars/animation_covers/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Medium.ttf
          weight: 500
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4/SourceSerif4-Regular.ttf
          weight: 400
