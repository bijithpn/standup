name: macOS Release Pipeline

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - appcast.xml
      - release_notes.md

jobs:
  build-and-release:
    name: Build & Release macOS App
    runs-on: macos-14

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: version_info
        shell: bash
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          SHORT_VERSION=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$RAW_VERSION" | cut -d'+' -f2)
          TAG_NAME="v${SHORT_VERSION}"

          echo "SHORT_VERSION=$SHORT_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Debug Environment
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: Install Dependencies
        run: |
          brew install create-dmg
          npm install -g appdmg

      - name: Flutter Clean
        run: flutter clean

      - name: Get Packages
        run: flutter pub get

      - name: Reset CocoaPods
        run: |
          rm -rf macos/Pods
          rm -f macos/Podfile.lock

      - name: Install CocoaPods
        run: |
          cd macos
          pod repo update
          pod install --repo-update

      - name: Build macOS App
        run: |
          flutter build macos \
          --flavor prod \
          --release \
          --verbose

      - name: Verify Build Output
        run: |
          echo "Checking build output..."
          ls -la build/macos/Build/Products/
          ls -la build/macos/Build/Products/Release-prod/

      - name: Create DMG
        run: |
          mkdir -p release_dmg

          APP_PATH="build/macos/Build/Products/Release-prod/BreakMate.app"
          DMG_PATH="release_dmg/BreakMate-Installer.dmg"

          if [ ! -d "$APP_PATH" ]; then
            echo "❌ App not found at $APP_PATH"
            exit 1
          fi

          create-dmg \
            --volname "BreakMate" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "$DMG_PATH" \
            "$APP_PATH"

          echo "✅ DMG created successfully"
          ls -la release_dmg/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BreakMate-macOS
          path: |
            build/macos/Build/Products/Release-prod/BreakMate.app
            release_dmg/BreakMate-Installer.dmg

      - name: Sign DMG
        id: signing
        env:
          SPARKLE_PRIVATE_KEY_CONTENT: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY_CONTENT" > /tmp/sparkle_private.pem

          SIGN_UPDATE=$(find macos/Pods/Sparkle -name sign_update -type f | head -1)

          if [ -z "$SIGN_UPDATE" ]; then
            echo "sign_update tool not found"
            exit 1
          fi

          chmod +x "$SIGN_UPDATE"

          DMG_PATH="release_dmg/BreakMate-Installer.dmg"

          SIGN_OUTPUT=$("$SIGN_UPDATE" "$DMG_PATH" --ed-key-file /tmp/sparkle_private.pem)

          SIGNATURE=$(echo "$SIGN_OUTPUT" | grep -oE 'sparkle:edSignature="[^"]+"' | sed 's/sparkle:edSignature="//;s/"$//')

          FILE_SIZE=$(stat -f%z "$DMG_PATH")

          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "pub_date=$(date -u +'%a, %d %b %Y %H:%M:%S +0000')" >> $GITHUB_OUTPUT

      - name: Update Appcast
        shell: python
        run: |
          import re

          appcast_path = "appcast.xml"

          version = "${{ steps.version_info.outputs.SHORT_VERSION }}"
          build = "${{ steps.version_info.outputs.BUILD_NUMBER }}"
          signature = "${{ steps.signing.outputs.signature }}"
          file_size = "${{ steps.signing.outputs.file_size }}"
          pub_date = "${{ steps.signing.outputs.pub_date }}"

          download_url = (
              f"https://github.com/bijithintersmart/standup/releases/download/v{version}/BreakMate-Installer.dmg"
          )

          with open(appcast_path, "r", encoding="utf-8") as f:
              content = f.read()

          item = f"""
          <item>
              <title>Version {version}</title>
              <pubDate>{pub_date}</pubDate>
              <description><![CDATA[
              <h3>BreakMate v{version}</h3>
              <p>Bug fixes and performance improvements.</p>
              ]]></description>
              <enclosure
                  url="{download_url}"
                  sparkle:version="{build}"
                  sparkle:shortVersionString="{version}"
                  sparkle:edSignature="{signature}"
                  length="{file_size}"
                  type="application/octet-stream" />
          </item>
          """

          content = content.replace(
              "</channel>",
              item + "\n</channel>"
          )

          with open(appcast_path, "w", encoding="utf-8") as f:
              f.write(content)

      - name: Create Tag
        run: |
          git tag -f ${{ steps.version_info.outputs.TAG_NAME }}
          git push origin ${{ steps.version_info.outputs.TAG_NAME }} --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.TAG_NAME }}
          name: Release ${{ steps.version_info.outputs.TAG_NAME }}
          files: |
            release_dmg/BreakMate-Installer.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Appcast
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add appcast.xml

          git commit -m "chore: update appcast.xml for ${{ steps.version_info.outputs.TAG_NAME }} [skip ci]" || true

          git push origin main