name: macOS Release Pipeline

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "appcast.xml"

jobs:
  build-and-release:
    name: Build & Release macOS App
    runs-on: macos-14

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: version_info
        shell: bash
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')

          SHORT_VERSION=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$RAW_VERSION" | cut -d'+' -f2)

          TAG_NAME="v${SHORT_VERSION}"

          echo "SHORT_VERSION=$SHORT_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: |
          brew install create-dmg

      - name: Install Flutter Packages
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      - name: Verify App Exists
        run: |
          APP_PATH="build/macos/Build/Products/Release/BreakMate.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found!"
            exit 1
          fi

      - name: Create DMG
        run: |
          chmod +x scripts/create_dmg.sh
          ./scripts/create_dmg.sh

      - name: Verify DMG
        run: |
          DMG_PATH="release_dmg/BreakMate-Installer.dmg"

          if [ ! -f "$DMG_PATH" ]; then
            echo "DMG not found!"
            exit 1
          fi

          ls -lh "$DMG_PATH"

      - name: Create Git Tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          TAG=${{ steps.version_info.outputs.TAG_NAME }}

          git tag "$TAG" || echo "Tag already exists"

          git push origin "$TAG" || echo "Tag already pushed"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.TAG_NAME }}
          name: Release ${{ steps.version_info.outputs.TAG_NAME }}

          files: |
            release_dmg/BreakMate-Installer.dmg

          generate_release_notes: true
          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
