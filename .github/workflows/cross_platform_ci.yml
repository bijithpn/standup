name: CI · Verify
run-name: "CI · ${{ github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}"

on:
  # main is verified by the release pipeline, so CI only runs on dev pushes and PRs.
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'appcast.xml'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis-and-tests:
    name: Analyze & Test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .github/flutter-version.yaml
          channel: stable
          cache: true

      - name: Disable SPM
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

  release-readiness:
    name: Release readiness (secrets & files)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check release files
        run: |
          fail=0
          for f in scripts/appdmg.json scripts/patch_appcast.py appcast.xml \
                   macos/Runner/Release.entitlements macos/Runner/Info.plist \
                   .github/workflows/macos_release.yml .github/workflows/desktop_release.yml; do
            if [ ! -f "$f" ]; then echo "::error::Missing required release file: $f"; fail=1; fi
          done
          if ! grep -q "<key>SUPublicEDKey</key>" macos/Runner/Info.plist; then
            echo "::error::SUPublicEDKey missing from macos/Runner/Info.plist"; fail=1
          fi
          exit $fail

      # Secrets are not exposed to PRs from forks, so skip the check there.
      - name: Check release secrets
        if: github.event.pull_request.head.repo.fork != true
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          fail=0
          # Required: Sparkle update signing.
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::Secret SPARKLE_PRIVATE_KEY is not set - releases would ship without an update signature."
            fail=1
          elif ! echo "$SPARKLE_PRIVATE_KEY" | tr -d '[:space:]' | grep -Eq '^[A-Za-z0-9+/]{43}=$'; then
            echo "::error::SPARKLE_PRIVATE_KEY does not look like a Sparkle Ed25519 key (expected 44-char base64)."
            fail=1
          else
            echo "SPARKLE_PRIVATE_KEY: OK"
          fi

          exit $fail

  build-macos:
    name: Build macOS
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .github/flutter-version.yaml
          channel: stable
          cache: true

      - name: Disable SPM
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Debug
        run: flutter build macos --debug --flavor dev --no-pub

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Plugin requirements (verified against each plugin's linux/CMakeLists.txt):
      #   tray_manager          -> ayatana-appindicator3-0.1
      #   hotkey_manager_linux  -> keybinder-3.0
      #   audioplayers_linux    -> gstreamer-1.0, -app-1.0, -audio-1.0
      #   sentry_flutter        -> sentry-native (crashpad) needs libcurl
      #   window_manager etc.   -> gtk+-3.0
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config git curl unzip xz-utils \
            libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev \
            libkeybinder-3.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libcurl4-openssl-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .github/flutter-version.yaml
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # `flutter build linux` has no --flavor option; lib/main.dart selects the
      # dev entry point automatically for debug builds.
      - name: Build Linux Debug
        run: flutter build linux --debug --no-pub

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .github/flutter-version.yaml
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # `flutter build windows` has no --flavor option either.
      - name: Build Windows Debug
        run: flutter build windows --debug --no-pub
