name: breakmate
description: "BreakMate — a macOS menu bar break reminder app for healthy work habits."
publish_to: "none"
version: 1.1.3+28
#BreakMate
environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  macos_ui: ^2.0.9
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  flutter_local_notifications: ^21.0.0
  launch_at_startup: ^0.5.1
  package_info_plus: ^9.0.1
  get_it: ^9.2.1
  provider: ^6.1.2
  flutter_riverpod: ^3.3.1
  screen_retriever: ^0.2.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  flutter_acrylic: ^1.0.4
  http: ^1.2.0
  flutter_markdown: ^0.7.7+1
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  audioplayers: ^6.1.0
  animations: ^2.0.1
  flame: ^1.37.0
  url_launcher: ^6.3.2
  lucide_icons_flutter: ^3.1.14+1
  flutter_widget_from_html: ^0.17.2
  markdown: ^7.3.1
  sentry_flutter: ^9.20.0
  path: ^1.9.1
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0
  build_runner: ^2.15.0
  objectbox_generator: ^5.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/cat/
    - assets/slideshow/
    # Original 4 cats
    - assets/animations/cats/grey_cat/sprite_sheet.png
    - assets/animations/cats/orange_cat/sprite_sheet.png
    - assets/animations/cats/black_cat/sprite_sheet.png
    - assets/animations/cats/large_cat/idle.png
    - assets/animations/cats/large_cat/run.png
    - assets/animations/cats/large_cat/fall.png
    - assets/animations/cats/large_cat/jump.png
    # New cats — separate-file packs
    - assets/animations/cats/pixel_cat/
    - assets/animations/cats/cat_1/
    - assets/animations/cats/cat_2/
    - assets/animations/cats/cat_3/
    - assets/animations/cats/cat_4/
    - assets/animations/cats/cat_5/
    - assets/animations/cats/cat_6/
    # New cat — composite sheet
    - assets/animations/cats/cat_50/cat_sheet.png
    # Dog sprite sheets
    - assets/animations/dogs/collie.png
    - assets/animations/dogs/corgi.png
    - assets/animations/dogs/dalmatian.png
    - assets/animations/dogs/husky.png
    - assets/animations/dogs/labrador.png
    # Modular pets framework
    - assets/animations/pets/pets.json
    - assets/animations/pets/
    # Lofi musics
    - assets/music/lofi_1.mp3

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/icons/app_icon.jpeg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.jpeg"
