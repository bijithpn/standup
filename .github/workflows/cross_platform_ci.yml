name: CI · Verify
run-name: "CI · ${{ github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}"

on:
  # main is verified by the release pipeline, so CI only runs on dev pushes and PRs.
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'appcast.xml'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with macos_release.yml and desktop_release.yml.
  FLUTTER_VERSION: '3.41.9'

jobs:
  static-analysis-and-tests:
    name: Analyze & Test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disable SPM
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: flutter pub get

      # Advisory for now: a large part of the codebase predates the formatter
      # check. Flip continue-on-error off after a one-off `dart format lib test`.
      - name: Check Code Formatting (advisory)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

  build-macos:
    name: Build macOS
    needs: static-analysis-and-tests
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disable SPM
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Debug
        run: flutter build macos --debug --flavor dev --no-pub

  build-linux:
    name: Build Linux
    needs: static-analysis-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Plugin requirements (verified against each plugin's linux/CMakeLists.txt):
      #   tray_manager          -> ayatana-appindicator3-0.1
      #   hotkey_manager_linux  -> keybinder-3.0
      #   audioplayers_linux    -> gstreamer-1.0, -app-1.0, -audio-1.0
      #   sentry_flutter        -> sentry-native (crashpad) needs libcurl
      #   window_manager etc.   -> gtk+-3.0
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config git curl unzip xz-utils \
            libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev \
            libkeybinder-3.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libcurl4-openssl-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # `flutter build linux` has no --flavor option; lib/main.dart selects the
      # dev entry point automatically for debug builds.
      - name: Build Linux Debug
        run: flutter build linux --debug --no-pub

  build-windows:
    name: Build Windows
    needs: static-analysis-and-tests
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # `flutter build windows` has no --flavor option either.
      - name: Build Windows Debug
        run: flutter build windows --debug --no-pub
