name: "Release · 2 · Linux & Windows"

# Builds Linux and Windows in parallel with the macOS pipeline. The cheap
# `attach` job waits for macos_release.yml to create the GitHub release, then
# uploads both builds to it.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'appcast.xml'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    name: Build & attach Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Extract Version Info
        id: version
        shell: bash
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          SHORT_VERSION=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          echo "short=$SHORT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${SHORT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev libkeybinder-3.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libcurl4-openssl-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .github/flutter-version.yaml
          channel: stable
          cache: true

      - name: Build Linux Release
        run: |
          flutter pub get
          flutter build linux --release --no-pub

      - name: Package tarball
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.short }}
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          if [ ! -x "$BUNDLE/breakmate" ]; then
            echo "::error::Linux bundle not found at $BUNDLE/breakmate"
            ls -la "$BUNDLE" || true
            exit 1
          fi

          STAGE="BreakMate-${VERSION}-linux-x64"
          mkdir -p dist "$STAGE"
          cp -r "$BUNDLE"/. "$STAGE"/
          cp linux/packaging/com.bijith.breakmate.desktop "$STAGE"/
          cp assets/icons/app_icon_bg.png "$STAGE"/com.bijith.breakmate.png
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"
          ls -la dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BreakMate-Linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Build & attach Windows
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Extract Version Info
        id: version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          SHORT_VERSION=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          echo "short=$SHORT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${SHORT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .github/flutter-version.yaml
          channel: stable
          cache: true

      - name: Build Windows Release
        run: |
          flutter pub get
          flutter build windows --release --no-pub

      - name: Verify build output
        run: |
          # BINARY_NAME in windows/CMakeLists.txt is BreakMateApp.
          OUT="build/windows/x64/runner/Release"
          if [ ! -f "$OUT/BreakMateApp.exe" ]; then
            echo "::error::BreakMateApp.exe not found in $OUT"
            ls -la "$OUT" || true
            exit 1
          fi

      - name: Package zip
        env:
          VERSION: ${{ steps.version.outputs.short }}
        run: |
          mkdir -p dist
          powershell -NoProfile -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/BreakMate-${VERSION}-windows-x64.zip' -Force"

      - name: Build installer (Inno Setup)
        env:
          VERSION: ${{ steps.version.outputs.short }}
          # Git Bash would otherwise rewrite the "/D..." switch as a path.
          MSYS_NO_PATHCONV: '1'
        run: |
          choco install innosetup --no-progress -y
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DMyAppVersion=${VERSION}" windows/installer/breakmate.iss
          cp "build/windows/installer/BreakMate-Setup-${VERSION}.exe" dist/
          ls -la dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BreakMate-Windows
          path: dist/*
          if-no-files-found: error

  attach:
    name: Attach to release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Wait for release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG_NAME="v$(echo "$RAW_VERSION" | cut -d'+' -f1)"
          for _ in $(seq 1 80); do
            if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" dist/* --clobber --repo "${{ github.repository }}"
              exit 0
            fi
            echo "Waiting for release $TAG_NAME (macOS pipeline)..."
            sleep 30
          done
          echo "::error::Release $TAG_NAME was not created within 40 minutes."
          exit 1
