name: macOS Release Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "appcast.xml"

jobs:
  build-and-release:
    name: Build, Package & Release macOS App
    runs-on: macos-14

    permissions:
      contents: write

    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    env:
      FLUTTER_VERSION: "stable"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Information
        id: version_info
        shell: bash
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')

          SHORT_VERSION=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$RAW_VERSION" | cut -d'+' -f2)

          TAG_NAME="v${SHORT_VERSION}"

          echo "SHORT_VERSION=$SHORT_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

          echo "Version: $SHORT_VERSION"
          echo "Build: $BUILD_NUMBER"
          echo "Tag: $TAG_NAME"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install create-dmg

      - name: Install Flutter Packages
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Debug Build Output
        run: |
          ls -R build/macos || true

      - name: Verify App Exists
        run: |
          APP_PATH="build/macos/Build/Products/Release/BreakMate.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found!"
            exit 1
          fi

          echo "App bundle found"

      - name: Create DMG
        run: |
          chmod +x scripts/create_dmg.sh
          dos2unix scripts/create_dmg.sh || true

          ./scripts/create_dmg.sh

      - name: Verify DMG Exists
        run: |
          DMG_PATH="release_dmg/BreakMate-Installer.dmg"

          if [ ! -f "$DMG_PATH" ]; then
            echo "DMG not found!"
            exit 1
          fi

          ls -lh "$DMG_PATH"

      - name: Restore Sparkle Private Key
        run: |
          echo "${{ secrets.SPARKLE_EDDSA_KEY_BASE64 }}" | base64 --decode > sparkle_priv.key
          chmod 600 sparkle_priv.key

      - name: Install Sparkle Tools
        run: |
          curl -L https://github.com/sparkle-project/Sparkle/releases/latest/download/Sparkle.tar.xz -o sparkle.tar.xz

          tar -xf sparkle.tar.xz

          find . -name sign_update

      - name: Generate Sparkle Signature
        id: sparkle_signature
        shell: bash
        run: |
          DMG_PATH="release_dmg/BreakMate-Installer.dmg"

          FILE_SIZE=$(stat -f%z "$DMG_PATH")

          SIGN_TOOL=$(find . -name sign_update | head -n 1)

          if [ -z "$SIGN_TOOL" ]; then
            echo "sign_update not found"
            exit 1
          fi

          SIGN_OUTPUT=$($SIGN_TOOL -f sparkle_priv.key "$DMG_PATH")

          echo "$SIGN_OUTPUT"

          SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')

          if [ -z "$SIGNATURE" ]; then
            echo "Failed to extract Sparkle signature"
            exit 1
          fi

          echo "SIGNATURE=$SIGNATURE" >> $GITHUB_OUTPUT
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Generate Appcast
        env:
          TAG_NAME: ${{ steps.version_info.outputs.TAG_NAME }}
          SHORT_VERSION: ${{ steps.version_info.outputs.SHORT_VERSION }}
          BUILD_NUMBER: ${{ steps.version_info.outputs.BUILD_NUMBER }}
          SIGNATURE: ${{ steps.sparkle_signature.outputs.SIGNATURE }}
          FILE_SIZE: ${{ steps.sparkle_signature.outputs.FILE_SIZE }}
        run: |
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/BreakMate-Installer.dmg"

          python3 scripts/generate_appcast.py \
            "$BUILD_NUMBER" \
            "$SHORT_VERSION" \
            "$DMG_URL" \
            "$SIGNATURE" \
            "$FILE_SIZE" \
            "appcast.xml"

          cat appcast.xml

      - name: Create Git Tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          TAG=${{ steps.version_info.outputs.TAG_NAME }}

          git tag "$TAG" || echo "Tag already exists"

          git push origin "$TAG" || echo "Tag already pushed"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.TAG_NAME }}
          name: Release ${{ steps.version_info.outputs.TAG_NAME }}
          files: |
            release_dmg/BreakMate-Installer.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated Appcast
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add appcast.xml

          git commit -m "chore: update appcast for ${{ steps.version_info.outputs.TAG_NAME }} [skip ci]" || echo "No changes to commit"

          git push origin main

      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f sparkle_priv.key
