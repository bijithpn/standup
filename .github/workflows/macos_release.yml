name: macOS Release Pipeline

on:
  push:
    tags:
      - "v*" # Runs only when pushing version tags like v1.0.0

jobs:
  build-and-release:
    name: Build, Sign, Notarize & Release macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install macOS Dependencies
        run: |
          brew install create-dmg
          brew install sparkle

      - name: Setup Apple Certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTS_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k $KEYCHAIN_PATH

          security list-keychain -d user -s $KEYCHAIN_PATH

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_PATH

      - name: Configure Notarytool API Key
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          PRIVATE_KEY_PATH=$RUNNER_TEMP/AuthKey_${KEY_ID}.p8

          echo -n "$PRIVATE_KEY_BASE64" | base64 --decode -o $PRIVATE_KEY_PATH

          xcrun notarytool store-credentials "AC_API" \
            --issuer "$ISSUER_ID" \
            --key-id "$KEY_ID" \
            --key "$PRIVATE_KEY_PATH"

      - name: Build Flutter macOS App
        run: |
          flutter pub get

          cd macos
          pod install
          cd ..

          flutter build macos --release

      - name: Create Signed DMG
        run: |
          chmod +x scripts/create_dmg.sh
          ./scripts/create_dmg.sh

      - name: Notarize and Staple DMG
        run: |
          chmod +x scripts/notarize.sh
          ./scripts/notarize.sh

      - name: Generate Sparkle Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > sparkle_priv.key

          SHORT_VERSION=$(echo $VERSION_TAG | sed 's/v//')
          BUILD_VERSION="100"

          DMG_PATH="release_dmg/standup-Installer.dmg"

          FILE_SIZE=$(stat -f%z "$DMG_PATH")

          # sign_update path differs on GitHub runners
          SIGNATURE=$(sign_update "$DMG_PATH" --ed25519 sparkle_priv.key)

          DMG_URL="https://github.com/bijithintersmart/standup/releases/download/${VERSION_TAG}/standup-Installer.dmg"

          python3 scripts/generate_appcast.py \
            "$BUILD_VERSION" \
            "$SHORT_VERSION" \
            "$DMG_URL" \
            "$SIGNATURE" \
            "$FILE_SIZE" \
            "appcast.xml"

          rm sparkle_priv.key

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_dmg/standup-Installer.dmg
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Appcast File
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add appcast.xml

          git commit -m "chore: update appcast for ${{ github.ref_name }}" || echo "No changes to commit"

          git push origin main
