name: "Release · 1 · macOS"
run-name: "Release · macOS · ${{ github.event.head_commit.message || github.ref_name }}"

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - 'appcast.xml'
      - '*.md'
      - 'docs/**'

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, publish & update appcast
    runs-on: macos-14
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Version Info
        id: version_info
        shell: bash
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          SHORT_VERSION=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$RAW_VERSION" | cut -d'+' -f2)
          TAG_NAME="v${SHORT_VERSION}"

          echo "SHORT_VERSION=$SHORT_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

          echo "Extracted Version: $SHORT_VERSION (Build $BUILD_NUMBER), Tag: $TAG_NAME"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .github/flutter-version.yaml
          channel: stable
          cache: true

      - name: Disable Swift Package Manager
        run: |
          flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: |
          npm install -g appdmg

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Build macOS App
        run: |
          flutter pub get
          cd macos && pod install && cd ..
          flutter build macos --flavor prod --release --verbose

      - name: Ad-hoc sign app
        run: |
          APP_PATH="build/macos/Build/Products/Release-prod/BreakMate.app"
          # Sign nested code first, then the app. Ad-hoc signatures avoid the
          # "app is damaged" error on Apple Silicon; Gatekeeper still asks for
          # a one-time "Open Anyway" on first install.
          while IFS= read -r item; do
            codesign --force --sign - "$item"
          done < <(find "$APP_PATH/Contents" \( -name "*.xpc" -o -name "*.app" -o -name "*.framework" -o -name "*.dylib" -o -name "Autoupdate" \) | awk '{print length, $0}' | sort -rn | cut -d' ' -f2-)
          codesign --force --sign - "$APP_PATH"
          codesign --verify --deep --verbose=2 "$APP_PATH"

      - name: Create DMG
        run: |
          mkdir -p release_dmg
          DMG_PATH="release_dmg/BreakMate-Installer.dmg"
          APP_PATH="build/macos/Build/Products/Release-prod/BreakMate.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "❌ App bundle not found at $APP_PATH"
            exit 1
          fi

          rm -f "$DMG_PATH"
          appdmg scripts/appdmg.json "$DMG_PATH"

          echo "✅ DMG created successfully at $DMG_PATH"
          ls -la "$DMG_PATH"

          # Checksum used by scripts/install.sh to verify the download.
          (cd release_dmg && shasum -a 256 BreakMate-Installer.dmg > BreakMate-Installer.dmg.sha256)
          cat release_dmg/BreakMate-Installer.dmg.sha256

      - name: Sign DMG with Sparkle
        id: signing
        env:
          SPARKLE_PRIVATE_KEY_CONTENT: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          DMG_PATH="release_dmg/BreakMate-Installer.dmg"
          FILE_SIZE=$(stat -f%z "$DMG_PATH")
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT

          # Locate sign_update tool
          SIGN_UPDATE=""
          for candidate in macos/Pods/Sparkle/bin/sign_update scripts/sign_update /usr/local/bin/sign_update /opt/homebrew/bin/sign_update; do
            if [ -x "$candidate" ]; then SIGN_UPDATE="$candidate"; break; fi
          done
          if [ -z "$SIGN_UPDATE" ]; then
            SIGN_UPDATE=$(find macos/Pods/Sparkle -name sign_update -type f 2>/dev/null | head -1)
          fi

          SIGNATURE=""
          if [ -n "$SPARKLE_PRIVATE_KEY_CONTENT" ] && [ -n "$SIGN_UPDATE" ] && [ -f "$SIGN_UPDATE" ]; then
            chmod +x "$SIGN_UPDATE"
            echo "$SPARKLE_PRIVATE_KEY_CONTENT" > /tmp/sparkle_private.pem
            chmod 600 /tmp/sparkle_private.pem

            SIGN_OUTPUT=$("$SIGN_UPDATE" "$DMG_PATH" --ed-key-file /tmp/sparkle_private.pem 2>&1 || true)
            rm -f /tmp/sparkle_private.pem

            SIGNATURE=$(echo "$SIGN_OUTPUT" | grep -oE 'sparkle:edSignature="[^"]+"' | sed 's/sparkle:edSignature="//;s/"$//')
            if [ -n "$SIGNATURE" ]; then
              echo "✅ Successfully generated Sparkle Ed25519 signature."
            else
              echo "::error::sign_update did not produce a signature. Output: $SIGN_OUTPUT"
              exit 1
            fi
          else
            echo "::error::SPARKLE_PRIVATE_KEY secret is not configured or sign_update tool is missing - refusing to publish an unsigned update."
            exit 1
          fi

          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        env:
          TAG_NAME: ${{ steps.version_info.outputs.TAG_NAME }}
          VERSION: ${{ steps.version_info.outputs.SHORT_VERSION }}
          REPO: ${{ github.repository }}
        run: |
          # Previous release tag, ignoring the one we are (re)creating.
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG_NAME" | head -n1 || true)
          if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..HEAD"; else RANGE="HEAD"; fi

          LOG=$(git log "$RANGE" --no-merges --pretty='%s' \
            | grep -viE '^chore: update appcast|update BreakMate installer DMG|\[skip ci\]' | head -n 100 || true)

          section() { # $1 = heading, $2 = commit-type regex
            local items
            items=$(echo "$LOG" | grep -E "^($2)(\([^)]*\))?!?: " | sed -E 's/^[a-z]+(\([^)]*\))?!?: /- /' || true)
            if [ -n "$items" ]; then printf '### %s\n%s\n\n' "$1" "$items"; fi
          }

          {
            echo "## BreakMate v${VERSION}"
            echo
            section "✨ New Features" "feat"
            section "🐛 Bug Fixes" "fix"
            section "⚡ Improvements" "perf|refactor|style"
            section "🔧 Build & Maintenance" "chore|ci|build|docs|test"
            OTHER=$(echo "$LOG" | grep -vE '^(feat|fix|perf|refactor|style|chore|ci|build|docs|test)(\([^)]*\))?!?: ' | sed 's/^/- /' || true)
            if [ -n "$OTHER" ]; then printf '### Other Changes\n%s\n\n' "$OTHER"; fi
            if [ -n "$PREV_TAG" ]; then
              echo "**Full changelog:** https://github.com/${REPO}/compare/${PREV_TAG}...${TAG_NAME}"
              echo
            fi
            cat <<EOF
          ### 🍎 Installing on macOS

          BreakMate is not notarized by Apple, so a DMG downloaded in a browser may show *"Apple could not verify BreakMate…"*. Use either fix:

          **Option 1: one-line install (recommended)**
          \`\`\`bash
          curl -fsSL https://github.com/${REPO}/releases/latest/download/install.sh | bash
          \`\`\`

          **Option 2: you already downloaded the DMG**
          \`\`\`bash
          xattr -cr /Applications/BreakMate.app
          \`\`\`
          or open **System Settings → Privacy & Security → Open Anyway**.

          **Homebrew**
          \`\`\`bash
          brew tap bijithpn/standup https://github.com/${REPO}
          brew install --cask breakmate
          \`\`\`

          **Uninstall:** \`curl -fsSL https://github.com/${REPO}/releases/latest/download/uninstall.sh | bash\` (add \`-s -- --purge\` to also delete settings). Linux: \`uninstall_linux.sh\`, Windows: \`uninstall.ps1\`.

          ### 🐧 Linux / 🪟 Windows one-liners

          \`\`\`bash
          curl -fsSL https://github.com/${REPO}/releases/latest/download/install_linux.sh | bash
          \`\`\`
          \`\`\`powershell
          irm https://github.com/${REPO}/releases/latest/download/install.ps1 | iex
          \`\`\`
          EOF
          } > release_notes.md

          cat release_notes.md

      - name: Update Appcast
        env:
          VERSION: ${{ steps.version_info.outputs.SHORT_VERSION }}
          BUILD_NUMBER: ${{ steps.version_info.outputs.BUILD_NUMBER }}
          SIGNATURE: ${{ steps.signing.outputs.signature }}
          FILE_SIZE: ${{ steps.signing.outputs.file_size }}
          TAG_NAME: ${{ steps.version_info.outputs.TAG_NAME }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/BreakMate-Installer.dmg"
          NOTES_FLAG=""
          if [ -f release_notes.md ]; then
            NOTES_FLAG="--notes-file release_notes.md"
          fi

          python3 scripts/patch_appcast.py \
            --appcast appcast.xml \
            --version "$VERSION" \
            --build "$BUILD_NUMBER" \
            --signature "$SIGNATURE" \
            --size "$FILE_SIZE" \
            --url "$DOWNLOAD_URL" \
            $NOTES_FLAG

      - name: Update Homebrew Cask
        env:
          VERSION: ${{ steps.version_info.outputs.SHORT_VERSION }}
        run: |
          SHA=$(awk '{print $1}' release_dmg/BreakMate-Installer.dmg.sha256)
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 .*/  sha256 \"${SHA}\"/" Casks/breakmate.rb
          grep -nE '^  (version|sha256)' Casks/breakmate.rb

      - name: Commit and Push Appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add appcast.xml Casks/breakmate.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore: update appcast and cask for ${{ steps.version_info.outputs.TAG_NAME }} [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main && git push origin HEAD:main && break
              if [ "$attempt" = 3 ]; then echo "::error::Could not push appcast.xml after 3 attempts"; exit 1; fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            echo "✅ appcast.xml and cask committed and pushed to main"
          else
            echo "appcast and cask unchanged — nothing to commit."
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version_info.outputs.TAG_NAME }}
          VERSION: ${{ steps.version_info.outputs.SHORT_VERSION }}
        run: |
          ASSETS=(release_dmg/BreakMate-Installer.dmg release_dmg/BreakMate-Installer.dmg.sha256 scripts/install.sh scripts/install_linux.sh scripts/install.ps1 scripts/uninstall.sh scripts/uninstall_linux.sh scripts/uninstall.ps1)

          if [ -s release_notes.md ]; then
            NOTES=(--notes-file release_notes.md)
          else
            NOTES=(--generate-notes)
          fi

          if gh release view "$TAG_NAME" &>/dev/null; then
            # Re-run: update the existing release in place so the download URLs
            # stay valid and the release is never missing, then move the tag to
            # the commit that was just built.
            echo "Release $TAG_NAME already exists - updating in place..."
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
            if [ -s release_notes.md ]; then
              gh release edit "$TAG_NAME" --title "BreakMate v${VERSION}" --notes-file release_notes.md
            fi
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/${TAG_NAME}" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "BreakMate v${VERSION}" \
              "${NOTES[@]}"
          fi

          echo "✅ Release $TAG_NAME published successfully."

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BreakMate-macOS-Installer
          path: |
            release_dmg/BreakMate-Installer.dmg
            release_dmg/BreakMate-Installer.dmg.sha256
