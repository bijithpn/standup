name: standup
description: "standup — a macOS menu bar break reminder app for healthy work habits."
publish_to: 'none'
version: 1.0.0+1
#BreakMate
environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  macos_ui: ^2.0.9
  tray_manager: ^0.2.3
  window_manager: ^0.5.1
  flutter_local_notifications: ^18.0.1
  launch_at_startup: ^0.3.1
  package_info_plus: ^8.0.0
  shared_preferences: ^2.3.4
  get_it: ^8.0.3
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1
  screen_retriever: ^0.2.0
  fl_chart: ^0.66.0
  intl: ^0.19.0
  flutter_acrylic: ^1.0.4
  http: ^1.2.0
  flutter_markdown: ^0.6.18
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  audioplayers: ^6.1.0
  animations: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/cat/
    - assets/slideshow/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi/Fonts/Satoshi-Regular.ttf

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/icons/tray_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/tray_icon.png"
