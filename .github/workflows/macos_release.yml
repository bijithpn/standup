name: macOS Release Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'appcast.xml' # Prevent infinite loop when committing appcast back

jobs:
  build-and-release:
    name: Build, Package & Auto-Release macOS App
    runs-on: macos-latest
    permissions:
      contents: write # Required for creating releases and pushing tags

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version from pubspec.yaml
        id: version_info
        run: |
          # Extract version from pubspec.yaml (e.g., "1.0.0+23")
          RAW_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          
          # Separate semantic version and build number
          SHORT_VERSION=$(echo $RAW_VERSION | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $RAW_VERSION | cut -d'+' -f2)
          
          # Create tag name
          TAG_NAME="v${SHORT_VERSION}"
          
          echo "SHORT_VERSION=${SHORT_VERSION}" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          
          echo "Building version $SHORT_VERSION (Build $BUILD_NUMBER) for tag $TAG_NAME"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install macOS Dependencies
        run: |
          brew install create-dmg
          brew install sparkle

      - name: Build Flutter macOS App
        run: |
          flutter pub get
          cd macos
          pod install
          cd ..
          flutter build macos --release
- name: Install macOS Dependencies
  run: |
    brew install create-dmg
    brew install --cask sparkle

- name: Build Flutter macOS App
...
- name: Generate Sparkle Appcast
  env:
    SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
    TAG_NAME: ${{ steps.version_info.outputs.TAG_NAME }}
    SHORT_VERSION: ${{ steps.version_info.outputs.SHORT_VERSION }}
    BUILD_VERSION: ${{ steps.version_info.outputs.BUILD_NUMBER }}
  run: |
    echo "$SPARKLE_PRIVATE_KEY" > sparkle_priv.key

    DMG_PATH="release_dmg/BreakMate-Installer.dmg"
    FILE_SIZE=$(stat -f%z "$DMG_PATH")

    # Find the sign_update binary in the Caskroom
    SPARKLE_BIN=$(find /usr/local/Caskroom/sparkle -name sign_update | head -n 1)
    if [ -z "$SPARKLE_BIN" ]; then
      SPARKLE_BIN=$(find /opt/homebrew/Caskroom/sparkle -name sign_update | head -n 1)
    fi

    # Generate signature
    SIGNATURE=$($SPARKLE_BIN "$DMG_PATH" --ed25519 sparkle_priv.key)
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/BreakMate-Installer.dmg"

          python3 scripts/generate_appcast.py \
            "$BUILD_VERSION" \
            "$SHORT_VERSION" \
            "$DMG_URL" \
            "$SIGNATURE" \
            "$FILE_SIZE" \
            "appcast.xml"

          rm sparkle_priv.key

          - name: Publish GitHub Release
          uses: softprops/action-gh-release@v1
          with:
          tag_name: ${{ steps.version_info.outputs.TAG_NAME }}
          files: release_dmg/BreakMate-Installer.dmg
          name: Release ${{ steps.version_info.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Appcast File in Repository
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add appcast.xml
          git commit -m "chore: update appcast for ${{ steps.version_info.outputs.TAG_NAME }} [skip ci]" || echo "No changes to commit"
          git push origin main
