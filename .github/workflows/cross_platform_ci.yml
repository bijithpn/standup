name: Cross-Platform CI Verification

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis-and-tests:
    name: Analyzer & Unit Tests
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Disable SPM
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib tool

      - name: Static Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

  build-macos:
    name: macOS Build Check
    needs: static-analysis-and-tests
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Disable SPM
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Debug
        run: flutter build macos --debug --flavor dev --no-pub

  build-linux:
    name: Linux Headless Build Check
    needs: static-analysis-and-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Debug
        run: flutter build linux --debug --flavor dev --no-pub

  build-windows:
    name: Windows Headless Build Check
    needs: static-analysis-and-tests
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Debug
        run: flutter build windows --debug --flavor dev --no-pub
